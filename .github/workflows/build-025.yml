name: Build 025 geometry and topology tests

on:
  push:
    branches:
      - agent/build-025-array-engine
  pull_request:
    paths:
      - "geometry_authority.py"
      - "array_*.py"
      - "tests/test_geometry_authority.py"
      - "tests/test_array_topology.py"
      - "tests/test_array_engine.py"
      - "pyproject.toml"
      - ".github/workflows/build-025.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-025:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run Build 025 authority tests
        run: |
          pytest -q \
            tests/test_geometry_authority.py \
            tests/test_array_topology.py \
            tests/test_array_engine.py
