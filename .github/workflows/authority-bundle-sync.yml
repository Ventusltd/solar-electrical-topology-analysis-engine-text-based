name: Authority Bundle Projection

on:
  push:
    branches:
      - main
    paths:
      - "scripts/build_authority_bundle.py"
      - "scripts/reference_block_command.py"
      - "src/solar_topology/**"
      - ".github/workflows/authority-bundle-sync.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: authority-bundle-projection-main
  cancel-in-progress: false

jobs:
  project:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: python -m pip install -e .

      - name: Generate authority bundle
        run: python scripts/build_authority_bundle.py --write

      - name: Commit generated bundle
        run: |
          if git diff --quiet -- authority-bundles/reference-inverter-block.json; then
            echo "Authority bundle already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add authority-bundles/reference-inverter-block.json
          git commit -m "data: project reference authority bundle"
          git push origin HEAD:main
