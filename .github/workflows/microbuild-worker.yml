name: Microbuild Worker

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".microbuild/**"
      - "microbuild-plan.json"
      - "scripts/check_microbuild_plan.py"
      - "scripts/run_microbuild.py"
      - "scripts/advance_microbuild.py"
      - "scripts/microbuild_*.py"
      - "scripts/build_authority_bundle.py"
      - "scripts/reference_block_command.py"
      - "scripts/local_authority_bridge.py"
      - "scripts/run_authority_slice.py"
      - "scripts/validate_clean_wheel.py"
      - "scripts/validate_inverter_block_wheel.py"
      - "tests/test_microbuild*.py"
      - "tests/test_reference_block_command.py"
      - "tests/test_authority_bundle.py"
      - "tests/test_local_authority_bridge.py"
      - "tests/test_end_to_end_authority_slice.py"
      - "schemas/authority-response.schema.json"
      - "authority-bundles/**"
      - "src/solar_topology/**"
      - "v10-development/topology-studio.html"
      - "v10-development/authority/**"
      - "v10-development/tests/studio-authority.test.mjs"
      - "v10-development/tests/studio-authority-evidence.test.mjs"
      - ".github/workflows/microbuild-worker.yml"
  push:
    branches:
      - main
    paths:
      - ".microbuild/**"
      - "microbuild-plan.json"
      - "scripts/check_microbuild_plan.py"
      - "scripts/run_microbuild.py"
      - "scripts/advance_microbuild.py"
      - "scripts/microbuild_*.py"
      - "scripts/build_authority_bundle.py"
      - "scripts/reference_block_command.py"
      - "scripts/local_authority_bridge.py"
      - "scripts/run_authority_slice.py"
      - "scripts/validate_clean_wheel.py"
      - "scripts/validate_inverter_block_wheel.py"
      - "tests/test_microbuild*.py"
      - "tests/test_reference_block_command.py"
      - "tests/test_authority_bundle.py"
      - "tests/test_local_authority_bridge.py"
      - "tests/test_end_to_end_authority_slice.py"
      - "schemas/authority-response.schema.json"
      - "authority-bundles/**"
      - "src/solar_topology/**"
      - "v10-development/topology-studio.html"
      - "v10-development/authority/**"
      - "v10-development/tests/studio-authority.test.mjs"
      - "v10-development/tests/studio-authority-evidence.test.mjs"
      - ".github/workflows/microbuild-worker.yml"

permissions:
  contents: read

concurrency:
  group: microbuild-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  active-step:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out full repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install package and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" "build>=1.2"

      - name: Validate microbuild manifest
        id: manifest
        run: |
          summary="$(python scripts/check_microbuild_plan.py --check)"
          echo "$summary"
          programme_status="$(python -c 'import json,sys; print(json.load(sys.stdin)["programme_status"])' <<< "$summary")"
          echo "programme_status=$programme_status" >> "$GITHUB_OUTPUT"

      - name: Generate authority-bundle candidate
        run: |
          python scripts/build_authority_bundle.py \
            --write \
            --output .microbuild/candidates/reference-inverter-block.json

      - name: Run active allowlisted test
        if: steps.manifest.outputs.programme_status != 'completed'
        run: python scripts/run_microbuild.py --execute

      - name: Confirm completed programme
        if: steps.manifest.outputs.programme_status == 'completed'
        run: python scripts/run_microbuild.py

      - name: Upload authority-bundle candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authority-bundle-candidate-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 90
          path: .microbuild/candidates/reference-inverter-block.json

      - name: Write canonical microbuild evidence
        if: success() && steps.manifest.outputs.programme_status != 'completed'
        run: |
          python scripts/microbuild_evidence.py \
            --tested-commit "$GITHUB_SHA" \
            --result pass \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --output .microbuild/evidence/latest.json

      - name: Upload microbuild evidence
        if: success() && steps.manifest.outputs.programme_status != 'completed'
        uses: actions/upload-artifact@v4
        with:
          name: microbuild-evidence-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: .microbuild/evidence/latest.json
