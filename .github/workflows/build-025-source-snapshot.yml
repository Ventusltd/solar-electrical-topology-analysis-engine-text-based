name: Build 025 source snapshot

on:
  pull_request:
    paths:
      - "geometry_authority.py"
      - "array_*.py"
      - "tests/test_geometry_authority.py"
      - "tests/test_array_*.py"
      - "pyproject.toml"
      - ".github/workflows/build-025-source-snapshot.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: build-025-source
          path: |
            geometry_authority.py
            array_*.py
            tests/test_geometry_authority.py
            tests/test_array_*.py
            pyproject.toml
          if-no-files-found: error
          retention-days: 1
