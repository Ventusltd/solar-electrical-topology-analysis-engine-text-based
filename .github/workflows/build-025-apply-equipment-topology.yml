name: Apply Build 025 equipment topology patch

on:
  push:
    branches:
      - agent/build-025-array-engine
    paths:
      - ".build025/equipment-topology.patch.gz.b64"
      - ".github/workflows/build-025-apply-equipment-topology.yml"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/build-025-array-engine
          fetch-depth: 0

      - name: Decode and verify patch
        run: |
          base64 -d .build025/equipment-topology.patch.gz.b64 \
            | gzip -d > /tmp/equipment-topology.patch
          git apply --check /tmp/equipment-topology.patch

      - name: Apply equipment topology fix
        run: git apply /tmp/equipment-topology.patch

      - name: Run focused Build 025 tests
        run: |
          python -m pip install "pytest>=8"
          python -m pytest -q \
            tests/test_geometry_authority.py \
            tests/test_array_topology.py \
            tests/test_array_engine.py

      - name: Commit validated fix and remove temporary machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .build025/equipment-topology.patch.gz.b64 \
            .github/workflows/build-025-apply-equipment-topology.yml \
            .github/workflows/build-025-source-snapshot.yml
          git add array_topology.py array_engine.py tests/test_array_engine.py
          git commit -m "build 025: attach inverter input topology"
          git push origin HEAD:agent/build-025-array-engine
