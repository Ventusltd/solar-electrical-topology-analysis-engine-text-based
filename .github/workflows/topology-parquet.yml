name: Topology Parquet build

on:
  push:
    branches: [main]
    paths:
      - 'src/solar_topology/**'
      - 'scripts/build_topology_store.py'
      - 'pyproject.toml'
      - '.github/workflows/topology-parquet.yml'
  pull_request:
    paths:
      - 'src/solar_topology/**'
      - 'scripts/build_topology_store.py'
      - 'pyproject.toml'
      - '.github/workflows/topology-parquet.yml'
  workflow_dispatch:
    inputs:
      full_fleet:
        description: Build the full default fleet rather than the CI fixture
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install topology engine
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'

      - name: Build deterministic fixture
        if: github.event_name != 'workflow_dispatch' || !inputs.full_fleet
        run: |
          python scripts/build_topology_store.py \
            --fixture \
            --output data/topology/workflow-artifact

      - name: Build deterministic full fleet
        if: github.event_name == 'workflow_dispatch' && inputs.full_fleet
        run: |
          python scripts/build_topology_store.py \
            --output data/topology/workflow-artifact

      - name: Upload topology store
        uses: actions/upload-artifact@v4
        with:
          name: topology-parquet-store
          path: data/topology/workflow-artifact
          if-no-files-found: error
          compression-level: 0
