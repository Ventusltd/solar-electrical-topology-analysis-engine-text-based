name: Apply V6 and V7 leapfrog modes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v6-v7-leapfrog-20260727.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create exact restore point and apply controlled changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import re
          import shutil
          import subprocess

          root = Path('.')
          restore = root / 'restore_points/2026-07-27-pre-v6-v7-leapfrog-mode-final'
          if restore.exists():
              raise RuntimeError(f'Restore folder already exists: {restore}')

          protected = [
              'README.md',
              'index.html',
              'app.js',
              'styles.css',
              'spider-navigation.js',
              'physics.generated.js',
              'v7-development/index.html',
              'v7-development/feed-i/index.html',
              'v8-leapfrog/index.html',
          ]
          hashes = []
          for rel in protected:
              src = root / rel
              if not src.exists():
                  raise FileNotFoundError(rel)
              dst = restore / 'files' / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dst)
              digest = hashlib.sha256(src.read_bytes()).hexdigest()
              hashes.append((rel, digest))

          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          manifest = [
              '# Exact restore point — before V6/V7 leapfrog integration',
              '',
              'Date: 2026-07-27',
              'Branch: main',
              f'Pre-change commit: `{head}`',
              '',
              'This folder contains byte-for-byte copies of the working V6, V7, V8 and shared root files before leapfrog mode was completed in V6 and V7. It is a recovery folder, not a branch.',
              '',
              '## SHA-256 manifest',
              '',
          ]
          manifest += [f'- `{rel}` — `{digest}`' for rel, digest in hashes]
          manifest += [
              '',
              '## Recovery',
              '',
              'Copy the required file from `files/` back to its original repository path. Restore only the files needed; do not overwrite later evidence or research files without comparison.',
          ]
          restore.mkdir(parents=True, exist_ok=True)
          (restore / 'RESTORE_POINT.md').write_text('\n'.join(manifest) + '\n', encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          # ------------------------------------------------------------------
          # V6 HTML
          # ------------------------------------------------------------------
          p = root / 'index.html'
          html = p.read_text(encoding='utf-8')
          html = replace_once(
              html,
              '<div class="status"><span></span> V6 COMPLETE CIRCUIT</div>',
              '<div class="status"><span></span> V6 COMPLETE CIRCUIT · SEQUENTIAL / LEAPFROG</div>',
              'V6 status',
          )
          html = replace_once(
              html,
              '<label>Near-end allowance (m) <input id="nearAllowance" type="number" min="0" step="0.5" value="10"></label>',
              '<label>Distance from inverter to first string terminals (m) <input id="nearAllowance" type="number" min="0" step="0.5" value="10"></label>',
              'V6 inverter distance label',
          )
          html = replace_once(
              html,
              '<label>MPPT count <input id="mpptCount" type="number" min="1" value="12"></label>\n</section>',
              '<label>MPPT count <input id="mpptCount" type="number" min="1" value="12"></label>\n<label>String wiring topology <select id="wiringMode"><option value="sequential" selected>Sequential / opposite physical ends</option><option value="leapfrog">Leapfrog / both terminals at inverter end</option></select></label>\n<div class="provenance">Wiring mode changes the derived positive and negative home-run routes. Module geometry is unchanged.</div>\n</section>',
              'V6 wiring selector',
          )
          inset = '<div class="section-inset"><canvas id="sectionCanvas" width="520" height="190"></canvas><div><strong>A-frame section inset</strong><p>Module slope geometry remains separate from plan projection. The electrical model accounts for external conductors and module-integrated series leads.</p></div></div>'
          impact = inset + '<details open><summary>Sequential versus leapfrog wiring impact</summary><div style="padding:12px"><p class="note">Sequential wiring leaves one free string terminal at each physical end. Leapfrog returns through alternate modules so both free terminals emerge at the inverter-side end.</p><canvas id="leapfrogCanvas" width="900" height="300" style="display:block;width:100%;height:auto;background:#03070b;border:1px solid #263747"></canvas></div></details>'
          html = replace_once(html, inset, impact, 'V6 leapfrog diagram')
          html = replace_once(
              html,
              '<tr><th>ID</th><th>Face</th><th>Band</th><th>+ external m</th>',
              '<tr><th>ID</th><th>Face</th><th>Band</th><th>Mode</th><th>+ external m</th>',
              'V6 schedule mode header',
          )
          p.write_text(html, encoding='utf-8')

          # ------------------------------------------------------------------
          # V6 JavaScript
          # ------------------------------------------------------------------
          p = root / 'app.js'
          js = p.read_text(encoding='utf-8')
          js = replace_once(js, "'mpptCount','positiveLead'", "'mpptCount','wiringMode','positiveLead'", 'V6 ids')
          js = replace_once(
              js,
              "mpptCount:Math.max(1,Math.round(num('mpptCount'))),positiveLead:",
              "mpptCount:Math.max(1,Math.round(num('mpptCount'))),wiringMode:$('wiringMode').value,positiveLead:",
              'V6 input wiring mode',
          )
          js = replace_once(
              js,
              "function externalLengths(s){const near=Math.abs(s.x0-state.inverter.x),far=Math.abs(s.x1-state.inverter.x);return{positive:s.face==='E'?near:far,negative:s.face==='E'?far:near,near,far};}",
              "function externalLengths(s,m){const near=Math.abs(s.x0-state.inverter.x),far=Math.abs(s.x1-state.inverter.x);if(m.wiringMode==='leapfrog')return{positive:near,negative:near,near,far,mode:'leapfrog'};return{positive:s.face==='E'?near:far,negative:s.face==='E'?far:near,near,far,mode:'sequential'};}",
              'V6 external lengths',
          )
          js = replace_once(js, 'const ext=externalLengths(s),externalTotal=', 'const ext=externalLengths(s,m),externalTotal=', 'V6 study external lengths')
          js = replace_once(
              js,
              "const dExt=P.conductorDiameterFromArea(m.csa),dLead=P.conductorDiameterFromArea(m.leadCsa),twExt=safeTwoWire(m.externalSpacing,dExt,m.epsilonR),twModule=safeTwoWire(m.moduleSpacing,dLead,m.epsilonR);",
              "const dExt=P.conductorDiameterFromArea(m.csa),dLead=P.conductorDiameterFromArea(m.leadCsa),moduleSeparation=m.wiringMode==='leapfrog'?m.externalSpacing:m.moduleSpacing,twExt=safeTwoWire(m.externalSpacing,dExt,m.epsilonR),twModule=safeTwoWire(moduleSeparation,dLead,m.epsilonR);",
              'V6 module separation',
          )
          js = replace_once(
              js,
              "const area=Math.abs(s.x1-s.x0)*(m.moduleSpacing/1000)+externalTotal*(m.externalSpacing/1000)/2,delay=",
              "const area=Math.abs(s.x1-s.x0)*((m.wiringMode==='leapfrog'?m.externalSpacing:m.moduleSpacing)/1000)+externalTotal*(m.externalSpacing/1000)/2,delay=",
              'V6 loop area mode',
          )
          old_paths = "function paths(st,m){const s=st.s,displayOff=Math.max(.045,Math.min(.12,m.moduleLength*.025)),plusY=s.y-displayOff,minusY=s.y+displayOff,plusX=s.face==='E'?s.x0:s.x1,minusX=s.face==='E'?s.x1:s.x0;return{plus:[[state.inverter.x,plusY],[plusX,plusY]],module:[[s.x0,s.y],[s.x1,s.y]],minus:[[minusX,minusY],[state.inverter.x,minusY]],polygon:[[state.inverter.x,plusY],[plusX,plusY],[s.x0,s.y],[s.x1,s.y],[minusX,minusY],[state.inverter.x,minusY]]};}"
          new_paths = "function paths(st,m){const s=st.s,displayOff=Math.max(.045,Math.min(.12,m.moduleLength*.025)),plusY=s.y-displayOff,minusY=s.y+displayOff,leap=m.wiringMode==='leapfrog',plusX=leap?s.x0:(s.face==='E'?s.x0:s.x1),minusX=leap?s.x0:(s.face==='E'?s.x1:s.x0),polygon=leap?[[state.inverter.x,plusY],[s.x0,plusY],[s.x0,s.y],[s.x1,s.y],[s.x0,s.y],[s.x0,minusY],[state.inverter.x,minusY]]:[[state.inverter.x,plusY],[plusX,plusY],[s.x0,s.y],[s.x1,s.y],[minusX,minusY],[state.inverter.x,minusY]];return{plus:[[state.inverter.x,plusY],[plusX,plusY]],module:[[s.x0,s.y],[s.x1,s.y]],minus:[[minusX,minusY],[state.inverter.x,minusY]],polygon,leapfrog:leap,turnaround:[s.x1,s.y]};}"
          js = replace_once(js, old_paths, new_paths, 'V6 paths')
          js = replace_once(
              js,
              "blackCable(p.plus[0],p.plus[1],t,w);blackCable(p.minus[0],p.minus[1],t,w);blackCable(p.module[0],p.module[1],t,w);if(sel){",
              "blackCable(p.plus[0],p.plus[1],t,w);blackCable(p.minus[0],p.minus[1],t,w);blackCable(p.module[0],p.module[1],t,w);if(p.leapfrog){line([p.turnaround[0],p.turnaround[1]-.10],[p.turnaround[0],p.turnaround[1]+.10],t,'#000',w);}if(sel){",
              'V6 turnaround drawing',
          )

          impact_function = r'''
          function drawLeapfrogImpact(m,g,st){
              const c=$('leapfrogCanvas');if(!c)return;const x=c.getContext('2d'),W=c.width,H=c.height;x.clearRect(0,0,W,H);x.fillStyle='#03070b';x.fillRect(0,0,W,H);const invX=54,startX=180,count=12,mw=43,gap=8;
              function cable(points,width=4){x.save();x.lineJoin='round';x.lineCap='round';x.strokeStyle='rgba(235,244,250,.72)';x.lineWidth=width+2;x.beginPath();points.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();x.strokeStyle='#000';x.lineWidth=width;x.beginPath();points.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();x.restore();}
              function modules(y){for(let i=0;i<count;i++){const px=startX+i*(mw+gap);x.fillStyle=i%2?'#183c4c':'#214f62';x.fillRect(px,y,mw,42);x.strokeStyle='#75ddff';x.strokeRect(px,y,mw,42);x.fillStyle='#000';x.fillRect(px+mw/2-3,y+9,6,4);}}
              x.font='bold 15px ui-monospace,monospace';x.fillStyle='#ffb347';x.fillRect(invX,34,24,82);x.fillRect(invX,174,24,82);x.fillStyle='#ffd494';x.fillText('INVERTER',18,25);x.fillText('INVERTER',18,165);
              modules(50);modules(190);x.fillStyle='#ecf7ff';x.font='bold 17px ui-monospace,monospace';x.fillText('SEQUENTIAL',92,46);x.fillText('LEAPFROG',92,186);
              cable([[78,68],[startX,68]],4);const far=startX+(count-1)*(mw+gap)+mw/2;cable([[far,94],[far,126],[78,126]],4);x.fillText('+',88,66);x.fillText('−',88,126);
              cable([[78,208],[startX,208]],4);cable([[78,230],[startX+mw+gap,230]],4);x.fillText('+',88,206);x.fillText('−',88,232);for(let i=0;i<count-2;i+=2){const a=startX+i*(mw+gap)+mw/2,b=startX+(i+2)*(mw+gap)+mw/2;cable([[a,201],[b,201]],2);}for(let i=1;i<count-2;i+=2){const a=startX+i*(mw+gap)+mw/2,b=startX+(i+2)*(mw+gap)+mw/2;cable([[a,239],[b,239]],2);}cable([[startX+(count-2)*(mw+gap)+mw/2,201],[far,239]],2);
              x.fillStyle='#ff7b85';x.font='14px ui-monospace,monospace';x.fillText('One far-end return: + one row span of external cable',startX,146);x.fillStyle='#53e28b';x.fillText('Both free terminals emerge at inverter end',startX,276);x.fillStyle='#9db0c0';x.fillText(`Derived row span ${fmt(g.rowLength,2)} m · distance to first terminals ${fmt(m.nearAllowance,2)} m · selected ${m.wiringMode}`,18,296);
          }
          '''
          js = replace_once(js, 'function drawModules(s,m,g,t,selected){', impact_function + '\nfunction drawModules(s,m,g,t,selected){', 'V6 impact function')
          js = replace_once(
              js,
              "const st=studies.find(x=>x.s.id===state.selected)||null;draw(m,g,st,studies);set('totalStrings'",
              "const st=studies.find(x=>x.s.id===state.selected)||null;draw(m,g,st,studies);drawLeapfrogImpact(m,g,st);set('totalStrings'",
              'V6 impact render call',
          )
          js = replace_once(js, 'Differential and common-mode quantities remain separate.`;', 'Differential and common-mode quantities remain separate. Wiring mode: ${m.wiringMode}.`;','V6 decision mode')
          js = replace_once(js, '${m.connectorContacts} series contacts`;', '${m.connectorContacts} series contacts · ${m.wiringMode} wiring`;', 'V6 selected summary mode')
          js = replace_once(
              js,
              '<td>${x.s.band+1}</td><td>${fmt(x.ext.positive,2)}</td>',
              '<td>${x.s.band+1}</td><td>${m.wiringMode}</td><td>${fmt(x.ext.positive,2)}</td>',
              'V6 schedule mode cell',
          )
          js = replace_once(
              js,
              "if(m.connectorMilliOhm===.35)warnings.push('Connector resistance remains at the unverified 0.35 mΩ/contact placeholder.');",
              "if(m.connectorMilliOhm===.35)warnings.push('Connector resistance remains at the unverified 0.35 mΩ/contact placeholder.');if(m.wiringMode==='leapfrog')warnings.push('Leapfrog routing selected. Confirm the actual factory lead lengths, connector reach and as-built continuity before relying on the cable saving.');",
              'V6 leapfrog warning',
          )
          js = replace_once(js, "`FORMULA LIBRARY = ${P.formulaVersion}`,", "`FORMULA LIBRARY = ${P.formulaVersion}`,`WIRING MODE = ${m.wiringMode}; DISTANCE TO FIRST STRING TERMINALS = ${fmt(m.nearAllowance,3)} m`,", 'V6 trace mode')
          js = replace_once(js, "schema_version:'6.3.0-capacitance-common-mode-correction'", "schema_version:'6.4.0-leapfrog-routing-mode'", 'V6 schema version')
          js = replace_once(js, 'inputs:m,inverter:state.inverter,strings:', 'inputs:m,wiring_mode:m.wiringMode,distance_to_inverter_m:m.nearAllowance,inverter:state.inverter,strings:', 'V6 export mode')
          p.write_text(js, encoding='utf-8')

          # ------------------------------------------------------------------
          # V7 HTML and embedded JavaScript
          # ------------------------------------------------------------------
          p = root / 'v7-development/index.html'
          v7 = p.read_text(encoding='utf-8')
          v7 = replace_once(
              v7,
              '<label>Near allowance (m) <input id="near" type="number" value="10" step="0.5"></label>',
              '<label>Distance from inverter to first string terminals (m) <input id="near" type="number" value="10" step="0.5"></label>',
              'V7 distance label',
          )
          canvas_line = '<div class="canvasWrap" id="wrap"><div class="zoom"><button id="zoomOut">−</button><button id="zoomReset">100%</button><button id="zoomIn">+</button></div><canvas id="scene" width="2200" height="1350"></canvas></div>'
          v7 = replace_once(
              v7,
              canvas_line,
              canvas_line + '<div class="compare"><section><h3>Sequential versus leapfrog impact</h3><p style="color:var(--muted);font-size:12px">The physical modules remain fixed. Only the free-terminal positions and external home-run routes change.</p><canvas id="impactCanvas" width="1200" height="390" style="display:block;width:100%;height:auto;background:#03070b;border:1px solid var(--line)"></canvas></section><section><h3>How to read it</h3><ul><li>Sequential: one free terminal is at the far end.</li><li>Leapfrog: both free terminals emerge at the inverter end.</li><li>Potential external-cable saving: one complete row span per string.</li><li>The entered inverter distance applies to both positive and negative leapfrog home-runs.</li></ul></section></div>',
              'V7 impact diagram',
          )
          v7 = replace_once(
              v7,
              '<article><span>Selected + / −</span><strong id="selectedLengths">—</strong><small>external conductors</small></article>',
              '<article><span>Selected + / −</span><strong id="selectedLengths">—</strong><small>external conductors</small></article><article><span>Potential cable saving</span><strong id="cableSaving">—</strong><small>one row span / selected string</small></article>',
              'V7 saving metric',
          )
          v7 = replace_once(v7, "px=s.face==='E'?s.x0:s.x1,nx=s.face==='E'?s.x1:s.x0;", 'px=s.p,nx=s.n;', 'V7 rendered endpoints')
          v7 = replace_once(
              v7,
              'ctx.moveTo(sx(s.x0),sy(s.y));ctx.lineTo(sx(s.x1),sy(s.y));ctx.stroke();ctx.fillStyle=',
              "ctx.moveTo(sx(s.x0),sy(s.y));ctx.lineTo(sx(s.x1),sy(s.y));ctx.stroke();if(text('wiring')==='leapfrog'){ctx.beginPath();ctx.moveTo(sx(s.x1),sy(s.y-.11));ctx.lineTo(sx(s.x1),sy(s.y+.11));ctx.stroke();}ctx.fillStyle=",
              'V7 far turnaround',
          )
          v7_impact = r'''
          function drawImpact(d){const c=$('impactCanvas');if(!c)return;const x=c.getContext('2d'),W=c.width,H=c.height;x.clearRect(0,0,W,H);x.fillStyle='#03070b';x.fillRect(0,0,W,H);const invX=65,start=210,count=14,mw=47,gap=9;function cable(points,w=4){x.save();x.lineCap='round';x.lineJoin='round';x.strokeStyle='rgba(235,244,250,.7)';x.lineWidth=w+2;x.beginPath();points.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();x.strokeStyle='#000';x.lineWidth=w;x.beginPath();points.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();x.restore();}function mods(y){for(let i=0;i<count;i++){const q=start+i*(mw+gap);x.fillStyle=i%2?'#153d50':'#214e63';x.fillRect(q,y,mw,45);x.strokeStyle='#6fe0ff';x.strokeRect(q,y,mw,45);x.fillStyle='#000';x.fillRect(q+mw/2-3,y+10,6,4);}}x.fillStyle='#ffb347';x.fillRect(invX,42,26,90);x.fillRect(invX,224,26,90);x.fillStyle='#ffd494';x.font='bold 15px ui-monospace,monospace';x.fillText('INVERTER',22,33);x.fillText('INVERTER',22,215);mods(62);mods(244);x.fillStyle='#eef7ff';x.font='bold 18px ui-monospace,monospace';x.fillText('SEQUENTIAL',107,57);x.fillText('LEAPFROG',107,239);const far=start+(count-1)*(mw+gap)+mw/2;cable([[91,80],[start,80]],4);cable([[far,105],[far,155],[91,155]],4);x.fillText('+',110,78);x.fillText('−',110,155);cable([[91,262],[start,262]],4);cable([[91,286],[start+mw+gap,286]],4);x.fillText('+',110,260);x.fillText('−',110,288);for(let i=0;i<count-2;i+=2){const a=start+i*(mw+gap)+mw/2,b=start+(i+2)*(mw+gap)+mw/2;cable([[a,254],[b,254]],2);}for(let i=1;i<count-2;i+=2){const a=start+i*(mw+gap)+mw/2,b=start+(i+2)*(mw+gap)+mw/2;cable([[a,298],[b,298]],2);}cable([[start+(count-2)*(mw+gap)+mw/2,254],[far,298]],2);x.fillStyle='#ff6d77';x.font='14px ui-monospace,monospace';x.fillText('Far-end return adds approximately one row span',start,180);x.fillStyle='#53e28b';x.fillText('Both external home-runs begin at the same physical end',start,340);x.fillStyle='#91a8ba';x.fillText(`Row span ${d.row.toFixed(2)} m · inverter distance ${num('near').toFixed(2)} m · active mode ${text('wiring')}`,22,378);}
          '''
          v7 = replace_once(v7, 'function render(){try{', v7_impact + '\nfunction render(){try{', 'V7 impact function')
          v7 = replace_once(v7, 'renderCanvas(d);const invCount=', 'renderCanvas(d);drawImpact(d);const invCount=', 'V7 impact render')
          v7 = replace_once(v7, "$('selectedLengths').textContent=`+${s.p.toFixed(1)} / −${s.n.toFixed(1)} m`;", "$('selectedLengths').textContent=`+${s.p.toFixed(1)} / −${s.n.toFixed(1)} m`;$('cableSaving').textContent=d.row.toFixed(2)+' m';", 'V7 saving output')
          v7 = replace_once(v7, "version:'v7-development-geometry-recovered'", "version:'v7-development-leapfrog-routing-complete'", 'V7 export version')
          p.write_text(v7, encoding='utf-8')

          # ------------------------------------------------------------------
          # V6/V7/V8 comparison record and README
          # ------------------------------------------------------------------
          comparison = '''# V6 / V7 / V8 leapfrog comparison

## V6 complete-circuit workbench

- Preserves the full existing complete-circuit calculations.
- Adds a sequential/leapfrog selector.
- Uses an editable distance from the inverter to the first string terminals.
- In leapfrog mode, positive and negative external home-runs both terminate at the near physical end.
- Adds a diagram showing the far-return conductor removed by leapfrog.

## V7 independent topology workbench

- Retains its independent solver and physical array renderer.
- Its existing leapfrog calculation is now matched by the drawing.
- The positive and negative labels and routes both emerge at the near end in leapfrog mode.
- Adds the same explicit visual comparison and a row-span cable-saving metric.

## V8 leapfrog cable-schedule workbench

- Remains independent and unchanged by this integration.
- Compares both modes simultaneously rather than selecting only one.
- Aggregates external 6 mm² cable saving, resistance, loss and fleet scenarios.
- Its results are a screening schedule, not proof of an as-built topology.

## Shared invariant

A 30-module string always retains one positive and one negative electrical terminal. Leapfrog changes their physical location, not the series electrical circuit. Sequential wiring leaves the terminals at opposite physical ends; leapfrog brings both to the inverter-side end through the alternating module connection order.
'''
          comp_path = root / 'v8-leapfrog/V6_V7_V8_COMPARISON.md'
          comp_path.write_text(comparison, encoding='utf-8')

          readme_path = root / 'README.md'
          readme = readme_path.read_text(encoding='utf-8')
          addition = '''

## Sequential and leapfrog string wiring

The root V6 and independent V7 topology workbenches now include an editable wiring mode and an editable distance from the inverter to the first string terminals.

- Sequential wiring places one free electrical terminal at each physical end of the module row, so one polarity requires a far-end return home-run.
- Leapfrog wiring uses the factory module leads to travel outward through alternate modules and return through the skipped modules, bringing both free electrical terminals to the inverter-side end.
- Leapfrog therefore retains one positive and one negative home-run but can avoid approximately one complete row span of additional external 6 mm² DC string cable per string.

The independent V8 workbench compares both modes at the same time and aggregates the cable, resistance and loss difference:

- [V6 complete-circuit workbench](./)
- [V7 independent topology workbench](v7-development/)
- [V8 leapfrog cable-schedule workbench](v8-leapfrog/)
- [V6 / V7 / V8 comparison](v8-leapfrog/V6_V7_V8_COMPARISON.md)
- [Exact pre-integration restore point](restore_points/2026-07-27-pre-v6-v7-leapfrog-mode-final/RESTORE_POINT.md)

All three remain engineering screening tools. The actual factory lead lengths, connector reach, installed polarity sequence and as-built continuity must be confirmed before relying on a leapfrog cable quantity.
'''
          if '## Sequential and leapfrog string wiring' not in readme:
              readme = readme.rstrip() + addition + '\n'
          readme_path.write_text(readme, encoding='utf-8')

          # ------------------------------------------------------------------
          # Static validation
          # ------------------------------------------------------------------
          required = {
              'index.html': ['id="wiringMode"', 'id="leapfrogCanvas"', 'Distance from inverter to first string terminals'],
              'app.js': ["m.wiringMode==='leapfrog'", 'drawLeapfrogImpact', 'distance_to_inverter_m'],
              'v7-development/index.html': ['id="wiring"', 'id="impactCanvas"', 'drawImpact(d)', 'px=s.p,nx=s.n'],
              'v8-leapfrog/index.html': ['Leapfrog DC String Cable Schedule', 'id="distance"', 'id="diagram"'],
          }
          for rel, needles in required.items():
              data = (root / rel).read_text(encoding='utf-8')
              for needle in needles:
                  if needle not in data:
                      raise RuntimeError(f'{rel}: missing required marker {needle}')

          # Extract embedded V7 and V8 scripts for syntax checking.
          for rel, out in [('v7-development/index.html','/tmp/v7.js'),('v8-leapfrog/index.html','/tmp/v8.js')]:
              data=(root/rel).read_text(encoding='utf-8')
              scripts=re.findall(r'<script>(.*?)</script>',data,re.S)
              if not scripts:
                  raise RuntimeError(f'No embedded script found in {rel}')
              Path(out).write_text(scripts[-1],encoding='utf-8')
          PY

          node --check app.js
          node --check /tmp/v7.js
          node --check /tmp/v8.js

      - name: Commit controlled integration to main
        shell: bash
        run: |
          git config user.name "GlobalGrid2050 Engineering Bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md index.html app.js v7-development/index.html v8-leapfrog/V6_V7_V8_COMPARISON.md restore_points/2026-07-27-pre-v6-v7-leapfrog-mode-final
          git commit -m "Add leapfrog mode and inverter distance to V6 and V7"
          git push origin HEAD:main
