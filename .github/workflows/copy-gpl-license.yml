name: Copy GPL-3.0 licence

on:
  push:
    paths:
      - .github/workflows/copy-gpl-license.yml

permissions:
  contents: write

jobs:
  copy-license:
    runs-on: ubuntu-latest
    steps:
      - name: Copy exact V11 licence and remove this workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import urllib.request

          repo = "Ventusltd/solar-electrical-topology-analysis-engine-text-based"
          workflow_path = ".github/workflows/copy-gpl-license.yml"
          expected_blob = "f288702d2fa16d3cdf0035b15a9fcbc552cd88e7"
          source = "https://raw.githubusercontent.com/Ventusltd/v11/main/LICENSE"
          api = f"https://api.github.com/repos/{repo}/contents"
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "Ventus-License-Copier",
          }

          def request(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req) as response:
                  return json.loads(response.read().decode("utf-8"))

          with urllib.request.urlopen(source) as response:
              licence = response.read()

          blob = hashlib.sha1(
              f"blob {len(licence)}\0".encode("ascii") + licence
          ).hexdigest()
          if blob != expected_blob:
              raise SystemExit(f"V11 licence blob mismatch: {blob}")

          request(
              f"{api}/LICENSE",
              method="PUT",
              payload={
                  "message": "license: adopt GPL-3.0 by Product Owner direction",
                  "content": base64.b64encode(licence).decode("ascii"),
              },
          )

          workflow = request(f"{api}/{workflow_path}")
          request(
              f"{api}/{workflow_path}",
              method="DELETE",
              payload={
                  "message": "chore: remove one-shot licence copier",
                  "sha": workflow["sha"],
              },
          )
          PY
