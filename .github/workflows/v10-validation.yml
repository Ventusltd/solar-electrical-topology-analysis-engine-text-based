name: V10 Engine Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/solar_topology/**"
      - "tests/**"
      - "v8-leapfrog/**"
      - "v9-sandbox/debug/**"
      - "v10-development/src/**"
      - "v10-development/tests/**"
      - "v10-development/package.json"
      - ".github/workflows/v10-validation.yml"

permissions:
  contents: read

concurrency:
  group: v10-engine-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run complete Python suite
        run: python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run V8 regression suite
        run: node --test tests/v8-model.test.js

      - name: Run V9 deterministic engine suite
        run: node v9-sandbox/debug/run-tests.mjs

      - name: Run V10 JavaScript suite
        working-directory: v10-development
        run: npm test
