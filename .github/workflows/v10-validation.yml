name: V10 Engine Validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/solar_topology/**"
      - "tests/**"
      - "scripts/run_v10_validation.py"
      - "v8-leapfrog/**"
      - "v9-sandbox/debug/**"
      - "v10-development/src/**"
      - "v10-development/tests/**"
      - "v10-development/package.json"
      - ".github/workflows/v10-validation.yml"

permissions:
  contents: write

concurrency:
  group: v10-engine-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run all declared suites and write receipts
        id: validation
        continue-on-error: true
        run: python scripts/run_v10_validation.py

      - name: Commit paired validation receipts
        if: always()
        run: |
          git config user.name "GridBot"
          git config user.email "gridbot@users.noreply.github.com"
          git add \
            v10-development/recovery/validation/V10_VALIDATION_LATEST.md \
            v10-development/recovery/validation/V10_VALIDATION_LATEST.json
          if git diff --cached --quiet; then
            echo "Validation receipts are unchanged"
          else
            git commit -m "test: record V10 validation receipt"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce validation gate
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("v10-development/recovery/validation/V10_VALIDATION_LATEST.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          if not payload["pass"]:
              failed = [item["name"] for item in payload["results"] if not item["pass"]]
              raise SystemExit("V10 validation failed: " + ", ".join(failed))
          print("V10 validation passed")
          PY
