name: V10 Engine Validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".gitignore"
      - "programme-state.json"
      - "schemas/programme-state.schema.json"
      - "README.md"
      - "progress-dashboard.html"
      - "docs/quantum-spawn/**"
      - "docs/trueself/**"
      - "pyproject.toml"
      - "src/solar_topology/**"
      - "tests/**"
      - "scripts/build_authority_bundle.py"
      - "scripts/check_capsule_links.py"
      - "scripts/local_authority_bridge.py"
      - "scripts/run_authority_slice.py"
      - "scripts/run_v10_validation.py"
      - "scripts/validate_authority_bundle.py"
      - "scripts/validate_clean_wheel.py"
      - "scripts/validate_inverter_block_wheel.py"
      - "scripts/sync_programme_state.py"
      - "v8-leapfrog/**"
      - "v9-sandbox/debug/**"
      - "v10-development/src/**"
      - "v10-development/tests/**"
      - "v10-development/package.json"
      - ".github/workflows/v10-validation.yml"
  push:
    branches:
      - main
    paths:
      - ".gitignore"
      - "programme-state.json"
      - "schemas/programme-state.schema.json"
      - "README.md"
      - "progress-dashboard.html"
      - "docs/quantum-spawn/**"
      - "docs/trueself/**"
      - "pyproject.toml"
      - "src/solar_topology/**"
      - "tests/**"
      - "scripts/build_authority_bundle.py"
      - "scripts/check_capsule_links.py"
      - "scripts/local_authority_bridge.py"
      - "scripts/run_authority_slice.py"
      - "scripts/run_v10_validation.py"
      - "scripts/validate_authority_bundle.py"
      - "scripts/validate_clean_wheel.py"
      - "scripts/validate_inverter_block_wheel.py"
      - "scripts/sync_programme_state.py"
      - "v8-leapfrog/**"
      - "v9-sandbox/debug/**"
      - "v10-development/src/**"
      - "v10-development/tests/**"
      - "v10-development/package.json"
      - ".github/workflows/v10-validation.yml"

permissions:
  contents: read

concurrency:
  group: v10-engine-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python package and tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Generate authority-bundle candidate
        run: >-
          python scripts/build_authority_bundle.py
          --write
          --output .microbuild/candidates/reference-inverter-block.json

      - name: Enforce capsule-link integrity
        run: python scripts/check_capsule_links.py --check

      - name: Enforce programme-state manifest and public-page drift gate
        run: python scripts/sync_programme_state.py --check

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run all declared suites and write execution evidence
        id: validation
        continue-on-error: true
        run: python scripts/run_v10_validation.py

      - name: Upload validation execution envelope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-validation-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            v10-development/recovery/validation/V10_VALIDATION_LATEST.md
            v10-development/recovery/validation/V10_VALIDATION_LATEST.json

      - name: Enforce validation gate
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("v10-development/recovery/validation/V10_VALIDATION_LATEST.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          if not payload["pass"]:
              failed = [item["name"] for item in payload["results"] if not item["pass"]]
              raise SystemExit("V10 validation failed: " + ", ".join(failed))
          print("V10 validation passed")
          PY

  clean-wheel:
    name: Clean installed wheel authority
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install wheel build tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.2"

      - name: Build, install and probe outside repository
        run: python scripts/validate_clean_wheel.py
