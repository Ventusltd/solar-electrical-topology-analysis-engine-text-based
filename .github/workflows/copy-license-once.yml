name: Copy GPL-3.0 licence once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/copy-license-once.yml

permissions:
  contents: write

jobs:
  copy-license:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Copy exact V11 licence and remove this workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone "https://github.com/${REPOSITORY}.git" repository
          cd repository
          git checkout main
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/Ventusltd/v11/main/LICENSE \
            --output LICENSE
          test "$(git hash-object LICENSE)" = "f288702d2fa16d3cdf0035b15a9fcbc552cd88e7"
          rm .github/workflows/copy-license-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LICENSE .github/workflows/copy-license-once.yml
          git commit -m "license: adopt GPL-3.0"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git push origin HEAD:main
