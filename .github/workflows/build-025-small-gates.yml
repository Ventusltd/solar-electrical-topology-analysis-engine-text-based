name: Build 025 small gates

on:
  pull_request:
    paths:
      - "geometry_authority.py"
      - "array_*.py"
      - "tests/test_geometry_authority.py"
      - "tests/test_array_*.py"
      - ".github/workflows/build-025-small-gates.yml"

permissions:
  contents: read

jobs:
  syntax:
    name: 01 syntax only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Build 025 modules
        run: |
          python -m py_compile \
            geometry_authority.py \
            array_topology.py \
            array_route_types.py \
            array_route_geometry.py \
            array_routing.py \
            array_engine.py

  topology:
    name: 02 topology contracts
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest only
        run: python -m pip install pytest>=8
      - name: Run geometry and topology tests
        run: |
          python -m pytest -q \
            tests/test_geometry_authority.py \
            tests/test_array_topology.py

  routing:
    name: 03 routing and receipts
    runs-on: ubuntu-latest
    needs: topology
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest only
        run: python -m pip install pytest>=8
      - name: Run route-authority tests
        run: python -m pytest -q tests/test_array_engine.py

  regression:
    name: 04 repository regression
    runs-on: ubuntu-latest
    needs: routing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install repository test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run Python regression suite
        run: python -m pytest -q
