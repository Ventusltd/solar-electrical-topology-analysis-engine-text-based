[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-electrical-topology-engine"
version = "0.4.0"
description = "Geometry-authoritative topology, routing and evidence kernel for solar DC systems"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.4,<2",
    "numpy>=1.26",
    "pint>=0.24",
]

[project.optional-dependencies]
test = [
    "build>=1.2",
    "pytest>=8",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = [
    "geometry_authority",
    "array_topology",
    "array_route_types",
    "array_route_geometry",
    "array_routing",
    "array_engine",
    "table_string_assignment",
    "table_string_hashing",
    "table_string_validation",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["solar_topology*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
